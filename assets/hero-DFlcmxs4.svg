<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Временная иллюстрация для образца: светлый зал с зеркалом-аркой и креслом. Замените фотографией: положите hero.jpg в эту папку и укажите его в tenant.json. -->
  <defs>
    <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf9"/><stop offset="1" stop-color="#fff3e2"/></linearGradient>
    <linearGradient id="backwall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4e4"/><stop offset="1" stop-color="#ffe6cb"/></linearGradient>
    <linearGradient id="sideL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6d2ab"/><stop offset="1" stop-color="#fbe2c6"/></linearGradient>
    <linearGradient id="sideR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#f6d2ab"/><stop offset="1" stop-color="#fbe2c6"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="706" x2="0" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f1cda6"/><stop offset="0.4" stop-color="#ecc195"/><stop offset="1" stop-color="#e6b585"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="140" x2="0" y2="610" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#fff5e9"/><stop offset="1" stop-color="#ffe3c4"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a4a22" stop-opacity="0.32"/><stop offset="0.3" stop-color="#fff" stop-opacity="0.5"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#7a4a22" stop-opacity="0.36"/></linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9542f"/><stop offset="0.4" stop-color="#ee7a52"/><stop offset="1" stop-color="#b84a28"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d79a62"/><stop offset="1" stop-color="#b9783f"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="706" x2="0" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="floorMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1000"><rect x="0" y="706" width="1600" height="294" fill="url(#fade)"/></mask>
    <radialGradient id="haze" cx="800" cy="350" r="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="0.5" stop-color="#fff3e2" stop-opacity="0.25"/><stop offset="1" stop-color="#fff3e2" stop-opacity="0"/></radialGradient>
