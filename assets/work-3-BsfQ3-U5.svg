<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Временная картинка для образца: столб парикмахерской у входа. Замените фотографией работы. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.9"><stop offset="0" stop-color="#fffaf3"/><stop offset="0.55" stop-color="#ffedd8"/><stop offset="1" stop-color="#f8d3ab"/></radialGradient>
    <filter id="soft" x="-200" y="-200" width="1200" height="1400" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="wide" x="-200" y="-200" width="1200" height="1400" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="34"/></filter>
    <!-- Тень предмета: его очертания, залитые тёплым коричневым и размытые. -->
    <filter id="drop" x="-600" y="-600" width="1400" height="1400" filterUnits="userSpaceOnUse"><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.26  0 0 0 0 0.06  0 0 0 0.42 0"/><feGaussianBlur stdDeviation="14"/></filter>
    
    <linearGradient id="steelH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f8983"/><stop offset="0.3" stop-color="#f1eeea"/><stop offset="0.46" stop-color="#ffffff"/><stop offset="0.64" stop-color="#bdb6af"/><stop offset="1" stop-color="#7c756f"/></linearGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#dcd6cf"/><stop offset="0.75" stop-color="#a8a099"/><stop offset="1" stop-color="#8a827b"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a6a1c"/><stop offset="0.28" stop-color="#f3cd82"/><stop offset="0.44" stop-color="#fff4d3"/><stop offset="0.64" stop-color="#d59f3c"/><stop offset="1" stop-color="#8a5c16"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="0.16" stop-color="#f6e3c8"/><stop offset="0.6" stop-color="#e6caa2"/><stop offset="1" stop-color="#d3ae80"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a4a22" stop-opacity="0.34"/><stop offset="0.2" stop-color="#7a4a22" stop-opacity="0.04"/><stop offset="0.3" stop-color="#fff" stop-opacity="0.6"/><stop offset="0.38" stop-color="#fff" stop-opacity="0"/><stop offset="0.78" stop-color="#7a4a22" stop-opacity="0.1"/><stop offset="1" stop-color="#7a4a22" stop-opacity="0.4"/></linearGradient>
    <clipPath id="glassClip"><rect x="290" y="200" width="220" height="600" rx="10"/></clipPath>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="500" rx="300" ry="400" fill="#ff7a1a" opacity="0.14" filter="url(#wide)"/>
  <g filter="url(#drop)" transform="translate(26 20)"><rect x="268" y="160" width="264" height="768" rx="14"/></g>
  <g clip-path="url(#glassClip)">
    <rect x="290" y="200" width="220" height="600" fill="#fffdf9"/>
    <polygon points="290,128 510,-42 510,-2 290,168" fill="#ff7a1a"/><polygon points="290,224 510,54 510,94 290,264" fill="#f2b544"/><polygon points="290,320 510,150 510,190 290,360" fill="#ff7a1a"/><polygon points="290,416 510,246 510,286 290,456" fill="#f2b544"/><polygon points="290,512 510,342 510,382 290,552" fill="#ff7a1a"/><polygon points="290,608 510,438 510,478 290,648" fill="#f2b544"/><polygon points="290,704 510,534 510,574 290,744" fill="#ff7a1a"/><polygon points="290,800 510,630 510,670 290,840" fill="#f2b544"/><polygon points="290,896 510,726 510,766 290,936" fill="#ff7a1a"/><polygon points="290,992 510,822 510,862 290,1032" fill="#f2b544"/><polygon points="290,1088 510,918 510,958 290,1128" fill="#ff7a1a"/>
    <rect x="290" y="200" width="220" height="600" fill="url(#tube)"/>
  </g>
  <rect x="268" y="160" width="264" height="48" rx="12" fill="url(#brass)"/>
  <path d="M300 160Q400 70 500 160Z" fill="url(#brass)"/>
  <circle cx="400" cy="104" r="22" fill="url(#brass)"/>
  <rect x="268" y="792" width="264" height="48" rx="12" fill="url(#brass)"/>
  <rect x="330" y="840" width="140" height="70" fill="url(#brass)"/>
  <rect x="290" y="902" width="220" height="26" rx="8" fill="url(#brass)"/>
  <path d="M276 163H524M276 795H524" stroke="#fff4d3" stroke-opacity="0.9" stroke-width="1.6"/>
</svg>
